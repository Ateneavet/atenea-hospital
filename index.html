<!doctype html>
<html lang="es">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Software clínico · Atenea</title>

<body>

<div id="pantallaLogin"></div>

<div class="app oculto" id="appShell">

  <aside class="lateral" id="lateral">
    <div class="marca">
      <div class="logo"><img alt="" id="logoClinica" src="logo.png">A</div>
      <div>
        <h1 id="nombreClinica">Atenea</h1>
        <div class="sub" id="subClinica">Software clínico</div>
      </div>
    </div>
    <nav id="menu"></nav>
  </aside>

  <div class="velo-lateral" id="veloLateral" onclick="cerrarLateral()"></div>

  <div class="col">
    <div class="topbar">
      <button class="hamb" id="botHamb" aria-label="Abrir menú">☰</button>
      <button class="quien" id="botUsuario" style="border:0;background:none;cursor:pointer;margin-left:auto">
        <b id="usuarioActual">—</b>
        <span>cerrar sesión</span>
      </button>
    </div>
    <main class="caja" id="vista"></main>
  </div>

</div>

<div id="ventana"></div>

<!-- Cliente de Supabase (la librería), y después supabase.js, que la usa
     para conectarse al proyecto real — ahí se configuran la URL y la
     llave. datos.js: el catálogo y los datos de ejemplo que faltan por
     conectar. nucleo.js: ayudas y el motor que pinta pantallas. Las
     pantallas van una por archivo, por dominio. sesion.js y arranque.js
     van al final porque son quienes deciden qué se ve primero. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<script src="finanzas.js?v=18"></script>
<script src="ajustes.js?v=18"></script>
<script src="sesion.js?v=18"></script>
<script src="arranque.js?v=18"></script>
